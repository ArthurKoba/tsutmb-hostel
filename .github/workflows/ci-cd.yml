name: CI

on:
  push:
    branches: [master, dev, modernize-deployment]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run ruff check src
      - run: uv run ruff format --check --diff src
      - run: uv run python -m compileall -q src
      - run: PYTHONPATH=src uv run python -c "import telemetry"

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tsutmb-hostel:ci
          build-args: |
            ENV_TYPE=PRODUCTION
          cache-from: type=gha
          cache-to: type=gha,mode=max
