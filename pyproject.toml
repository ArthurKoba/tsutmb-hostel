[project]
name = "tsutmb-hostel"
version = "0.1.0"
description = "VK bot for TSUTMB hostel administration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogoogle>=5.17.0",
    "loguru>=0.7.3",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1,<2",
    "opentelemetry-sdk>=1.42.1,<2",
    "pydantic-settings>=2.14.1",
    "vkbottle>=4.8.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".git", ".venv", "__pycache__", "migrations", "logs", "tests", "htmlcov", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "EM",
    "ISC", "ICN", "G", "PIE", "T20", "PT", "Q", "RSE", "RET", "SLF", "SIM",
    "TID", "TCH", "ARG", "PTH", "ERA", "PGH", "PL", "TRY", "RUF",
]
ignore = ["E501", "TRY003", "PLR0913", "PLR2004", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pylint]
max-statements = 30

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = ["ruff>=0.15.14"]
